                    <script type="text/javascript">

  var searchFunc = function (path, search_id, content_id) {
    'use strict';
    var $input = document.getElementById(search_id);
    var $resultContent = document.getElementById(content_id);
    $resultContent.innerHTML = "<ul><span class='local-search-empty'>Loading Search Index...<span></ul>";
    $.ajax({
      // 0x01. load xml file
      url: path,
      dataType: "xml",
      success: function (xmlResponse) {
        // 0x02. parse xml file
        var datas = $("entry", xmlResponse).map(function () {
          return {
            title: $("title", this).text(),
            content: $("content", this).text(),
            url: $("url", this).text()
          };
        }).get();
        $resultContent.innerHTML = "";

        $input.addEventListener('input', function () {
          // 0x03. parse query to keywords list
          var str = '<ul class=\"search-result-list\">';
          var keywords = this.value.trim().toLowerCase().split(/[\s\-]+/);
          $resultContent.innerHTML = "";
          if (this.value.trim().length <= 0) {
            return;
          }
          // 0x04. perform local searching
          datas.forEach(function (data) {
            var isMatch = true;
            var content_index = [];
            if (!data.title || data.title.trim() === '') {
              data.title = "Untitled";
            }
            var orig_data_title = data.title.trim();
            var data_title = orig_data_title.toLowerCase();
            var orig_data_content = data.content.trim().replace(/<[^>]+>/g, "");
            var data_content = orig_data_content.toLowerCase();
            var data_url = data.url.replace(/^\/+/g, '');
            var index_title = -1;
            var index_content = -1;
            var first_occur = -1;
            // only match articles with not empty contents
            if (data_content !== '') {
              keywords.forEach(function (keyword, i) {
                index_title = data_title.indexOf(keyword);
                index_content = data_content.indexOf(keyword);

                if (index_title < 0 && index_content < 0) {
                  isMatch = false;
                } else {
                  if (index_content < 0) {
                    index_content = 0;
                  }
                  if (i == 0) {
                    first_occur = index_content;
                  }
                }
              });
            } else {
              isMatch = false;
            }
            // 0x05. show search results
            if (isMatch) {
              str += "<li><a href=/" + data_url + " class='search-result-title'>" + orig_data_title + "</a>";
              str += "</li>";
            }
          });
          str += "</ul>";
          if (str.indexOf('<li>') === -1) {
            return $resultContent.innerHTML = "<ul><span class='local-search-empty'>No Results Found<span></ul>";
          }
          $resultContent.innerHTML = str;
        });
      },
      error: function (xhr, status, error) {
        $resultContent.innerHTML = ""
        if (xhr.status === 404) {
          $resultContent.innerHTML = "<ul><span class='local-search-empty'>Search Index File Not Found<span></ul>";
        } else {
          $resultContent.innerHTML = "<ul><span class='local-search-empty'>Search Service Error<span></ul>";
        }
      }
    });
    $(document).on('click', '#search-close-icon', function () {
      $('#search-input').val('');
      $('#search-result').html('');
    });
  }
</script>

                    <script>
                        $(document).ready(function() {
                            var iconFolderOpenClass  = 'fa-folder-open';
                            var iconFolderCloseClass = 'fa-folder';
                            var iconAllExpandClass = 'fa-angle-double-down';
                            var iconAllPackClass = 'fa-angle-double-up';
                            // Handle directory-tree expansion:
                            // Left-click to expand the directory individually
                            $(document).on('click', '#categories a[data-role="directory"]', function (event) {
                                event.preventDefault();
                    
                                var icon = $(this).children('.fa');
                                var expanded = icon.hasClass(iconFolderOpenClass);
                                var subtree = $(this).siblings('ul');
                                icon.removeClass(iconFolderOpenClass).removeClass(iconFolderCloseClass);
                                if (expanded) {
                                    if (typeof subtree != 'undefined') {
                                        subtree.slideUp({ duration: 100 });
                                    }
                                    icon.addClass(iconFolderCloseClass);
                                } else {
                                    if (typeof subtree != 'undefined') {
                                        subtree.slideDown({ duration: 100 });
                                    }
                                    icon.addClass(iconFolderOpenClass);
                                }
                            });
                            // Right click to expand all subordinate directories
                            $('#categories a[data-role="directory"]').bind("contextmenu", function(event){
                                event.preventDefault();
                                
                                var icon = $(this).children('.fa');
                                var expanded = icon.hasClass(iconFolderOpenClass);
                                var listNode = $(this).siblings('ul');
                                var subtrees = $.merge(listNode.find('li ul'), listNode);
                                var icons = $.merge(listNode.find('.fa'), icon);
                                icons.removeClass(iconFolderOpenClass).removeClass(iconFolderCloseClass);
                                if(expanded) {
                                    subtrees.slideUp({ duration: 100 });
                                    icons.addClass(iconFolderCloseClass);
                                } else {
                                    subtrees.slideDown({ duration: 100 });
                                    icons.addClass(iconFolderOpenClass);
                                }
                            })
                            // Expand the close all directories button
                            $(document).on('click', '#allExpand', function (event) {
                                event.preventDefault();
                                
                                var icon = $(this).children('.fa');
                                var expanded = icon.hasClass(iconAllExpandClass);
                                icon.removeClass(iconAllExpandClass).removeClass(iconAllPackClass);
                                if(expanded) {
                                    $('#sidebar .fa.fa-folder').removeClass('fa-folder').addClass('fa-folder-open')
                                    $('#categories li ul').slideDown({ duration: 100 });
                                    icon.addClass(iconAllPackClass);
                                } else {
                                    $('#sidebar .fa.fa-folder-open').removeClass('fa-folder-open').addClass('fa-folder')
                                    $('#categories li ul').slideUp({ duration: 100 });
                                    icon.addClass(iconAllExpandClass);
                                }
                            });  
                        });
                    </script>
